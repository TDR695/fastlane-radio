name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Checks that the source builds. Nothing is uploaded: only signed builds are published, as releases.
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build FastLaneRadio.exe
        shell: cmd
        run: build.cmd
